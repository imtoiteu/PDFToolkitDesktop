<text x="1030.0" y="188.0" font-size="22.0" text-anchor="middle" fill="#0F172A" fill-opacity="0.75">cuối</text>
<rect x="40" y="300.0" width="280" height="152.0" rx="16.0" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.56"/>
<text x="180.0" y="373.0" font-size="22.0" text-anchor="middle" font-weight="700" fill="#7C2D12">Hệ tệp ảo MEMFS</text>
<text x="180.0" y="398.0" font-size="22.0" text-anchor="middle" font-weight="700" fill="#7C2D12">của qpdf</text>
<rect x="340" y="300.0" width="380" height="152.0" rx="8.0" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2.56"/>
<text x="530.0" y="361.5" font-size="20.0" text-anchor="middle" font-weight="400" fill="#0F172A">FS.writeFile(&#x27;/input.pdf&#x27;) →</text>
<text x="530.0" y="384.5" font-size="20.0" text-anchor="middle" font-weight="400" fill="#0F172A">callMain() →</text>
<text x="530.0" y="407.5" font-size="20.0" text-anchor="middle" font-weight="400" fill="#0F172A">FS.readFile(&#x27;/output.pdf&#x27;)</text>
<rect x="740" y="300.0" width="380" height="152.0" rx="8.0" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.56"/>
<text x="930.0" y="338.5" font-size="20.0" text-anchor="middle" font-weight="400" fill="#0C4A6E">Khối finally gọi FS.unlink()</text>
<text x="930.0" y="361.5" font-size="20.0" text-anchor="middle" font-weight="400" fill="#0C4A6E">cho cả hai đường dẫn, kể cả</text>
<text x="930.0" y="384.5" font-size="20.0" text-anchor="middle" font-weight="400" fill="#0C4A6E">khi qpdf ném ngoại lệ; thể</text>
