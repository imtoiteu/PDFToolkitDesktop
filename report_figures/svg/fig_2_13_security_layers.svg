<text x="560.0" y="698.8" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#7C2D12">qpdf-wasm: mã hoá AES-256, đặt mật khẩu</text>
<text x="560.0" y="722.5" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#7C2D12">người dùng và chủ sở hữu, cờ hạn chế</text>
<text x="560.0" y="746.1" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#7C2D12">in/sao chép/sửa</text>
