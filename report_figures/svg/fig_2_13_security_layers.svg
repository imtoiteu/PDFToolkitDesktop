<text x="560.0" y="820.3" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#7C2D12">zgapdfsigner + node-forge: ký số X.509</text>
<text x="560.0" y="844.0" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#7C2D12">từ PFX/PEM, khoá riêng chỉ tồn tại trong</text>
<text x="560.0" y="867.7" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#7C2D12">bộ nhớ trang; đóng dấu thời gian RFC</text>
<text x="560.0" y="891.3" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#7C2D12">3161</text>
<rect x="240" y="1025.4146341463415" width="640" height="84.97560975609757" rx="15.02439024390244" fill="#ECFDF5" stroke="#059669" stroke-width="2.56"/>
<text x="560.0" y="1053.1" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#064E3B">sanitize.ts: gỡ JavaScript, tệp nhúng, siêu dữ</text>
<text x="560.0" y="1076.7" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#064E3B">liệu, chú thích, liên kết, cây cấu trúc; redact.ts</text>
<text x="560.0" y="1100.4" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#064E3B">xoá vĩnh viễn nội dung</text>
<rect x="240" y="1115.5609756097563" width="640" height="84.97560975609757" rx="15.02439024390244" fill="#ECFDF5" stroke="#059669" stroke-width="2.56"/>
<text x="560.0" y="1143.2" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#064E3B">DOMPurify + escapeHtml + sanitizeEmailHtml cho mọi</text>
<text x="560.0" y="1166.9" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#064E3B">nội dung do tệp cung cấp; 22 ca kiểm thử tái hiện</text>
<text x="560.0" y="1190.5" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#064E3B">tấn công XSS</text>
<rect x="180" y="1220.7317073170732" width="760" height="78.87804878048782" rx="15.02439024390244" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.56"/>
<text x="560.0" y="1257.2" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#0C4A6E">WasmProvider: chỉ chấp nhận URL thuộc danh sách máy chủ tin</text>
<text x="560.0" y="1280.8" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#0C4A6E">cậy; URL lạ trong localStorage bị loại bỏ khi khởi động</text>
<rect x="120" y="1314.6341463414635" width="880" height="78.87804878048782" rx="15.02439024390244" fill="#F1F5F9" stroke="#334155" stroke-width="2.56"/>
<text x="560.0" y="1351.1" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#0F172A">capabilities/default.json chỉ cấp core:default — WebView không có</text>
<text x="560.0" y="1374.7" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#0F172A">quyền hệ tệp; mọi thao tác ghi đi qua lệnh save_file của Rust</text>
<rect x="60" y="1404.780487804878" width="1000" height="61.31707317073171" rx="15.02439024390244" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.56"/>
<text x="560.0" y="1432.4" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#1E1B4B">Không có tài khoản, không có phiên đăng nhập, không có nhật ký phía máy chủ,</text>
<text x="560.0" y="1456.1" font-size="20.658536585365855" text-anchor="middle" font-weight="400" fill="#1E1B4B">không có dữ liệu đo đạc gửi đi</text>
