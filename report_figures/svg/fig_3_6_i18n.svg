<text x="960.0" y="156.5" font-size="22.0" text-anchor="middle" fill="#064E3B" fill-opacity="0.75">i18next + HttpBackend,</text>
<text x="960.0" y="181.5" font-size="22.0" text-anchor="middle" fill="#064E3B" fill-opacity="0.75">hai không gian tên</text>
<text x="960.0" y="206.5" font-size="22.0" text-anchor="middle" fill="#064E3B" fill-opacity="0.75">common và tools</text>
<path d="M 40 320.0 H 532.0 L 560 348.0 V 580.0 H 40 Z" fill="#FEFCE8" stroke="#CA8A04" stroke-width="1.4"/><path d="M 532.0 320.0 V 348.0 H 560" fill="none" stroke="#CA8A04" stroke-width="2.56"/>
<text x="50" y="359.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12">public/locales/&lt;lang&gt;/common.json</text>
<text x="50" y="384.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12">·  tools.json</text>
<text x="50" y="409.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12"></text>
<text x="50" y="434.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12">21 ngôn ngữ: en, vi, ar, be, da,</text>
<text x="50" y="459.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12">de, es, fr, id, it, ja, ko, nl,</text>
<text x="50" y="484.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12">pt, ru, sk, sv, tr, uk, zh, zh-TW</text>
<text x="50" y="509.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12">Bản tiếng Việt: 272 khoá trong</text>
<text x="50" y="534.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12">common.json và 890 khoá trong</text>
<text x="50" y="559.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#713F12">tools.json</text>
<rect x="600" y="320.0" width="520" height="260.0" rx="16.0" fill="#ECFDF5" stroke="#059669" stroke-width="2.56"/>
<text x="610" y="384.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#064E3B">applyTranslations()</text>
<text x="610" y="409.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#064E3B"></text>
<text x="610" y="434.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#064E3B">Duyệt mọi phần tử mang data-i18n và</text>
<text x="610" y="459.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#064E3B">thay nội dung;</text>
<text x="610" y="484.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#064E3B">injectLanguageSwitcher() thêm bộ chọn</text>
<text x="610" y="509.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#064E3B">ngôn ngữ; setLanguageInPlace() đổi</text>
<text x="610" y="534.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#064E3B">ngôn ngữ mà không tải lại trang</text>
<rect x="40" y="680.0" width="520" height="300.0" rx="16.0" fill="#E0F2FE" stroke="#0284C7" stroke-width="2.56"/>
<text x="50" y="764.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#0C4A6E">Bản web (production)</text>
<text x="50" y="789.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#0C4A6E"></text>
<text x="50" y="814.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#0C4A6E">scripts/generate-i18n-pages.mjs sinh</text>
<text x="50" y="839.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#0C4A6E">sẵn thư mục /vi/, /fr/, … cho từng</text>
<text x="50" y="864.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#0C4A6E">trang; rewriteLinks() thêm tiền tố</text>
<text x="50" y="889.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#0C4A6E">ngôn ngữ vào mọi liên kết nội bộ;</text>
<text x="50" y="914.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#0C4A6E">sitemap và thẻ hreflang được sinh kèm</text>
<rect x="600" y="680.0" width="520" height="300.0" rx="16.0" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.56"/>
<text x="610" y="739.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D">Bản desktop (Tauri)</text>
<text x="610" y="764.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D"></text>
<text x="610" y="789.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D">Không sinh trang theo ngôn ngữ.</text>
<text x="610" y="814.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D">rewriteLinks() phải bỏ qua, nếu không</text>
<text x="610" y="839.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D">mọi liên kết sẽ trỏ tới</text>
<text x="610" y="864.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D">/vi/&lt;tool&gt;.html không tồn tại — đây</text>
<text x="610" y="889.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D">chính là lỗi thẻ công cụ không bấm</text>
<text x="610" y="914.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D">được ở lần tải đầu, đã sửa ở commit</text>
<text x="610" y="939.5" font-size="22.0" text-anchor="start" font-weight="400" fill="#7F1D1D">4a63fa9</text>
<rect x="40" y="1060.0" width="1080" height="180.0" rx="16.0" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.56"/>
<text x="580.0" y="1097.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#7C2D12">Điều kiện bảo vệ sau khi sửa lỗi (src/js/i18n/i18n.ts)</text>
<text x="580.0" y="1122.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#7C2D12"></text>
<text x="580.0" y="1147.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#7C2D12">const isTauri = import.meta.env.MODE === &#x27;tauri&#x27; || &#x27;__TAURI_INTERNALS__&#x27; in</text>
<text x="580.0" y="1172.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#7C2D12">window || &#x27;__TAURI__&#x27; in window;</text>
<text x="580.0" y="1197.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#7C2D12">if (import.meta.env.DEV || isTauri) return;   // giữ nguyên liên kết phẳng, dùng</text>
<text x="580.0" y="1222.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#7C2D12">cơ chế đổi ngôn ngữ tại chỗ</text>
<rect x="40" y="1300.0" width="1080" height="180.0" rx="16.0" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.56"/>
<text x="580.0" y="1337.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#1E1B4B">Nguyên tắc thiết kế bảo đảm tính ổn định</text>
<text x="580.0" y="1362.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#1E1B4B"></text>
<text x="580.0" y="1387.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#1E1B4B">Danh mục và công cụ được định danh bằng tên nội bộ cố định (getToolIdFromHref</text>
<text x="580.0" y="1412.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#1E1B4B">lấy phần tên tệp .html); chỉ nhãn hiển thị được dịch. Nhờ vậy việc đổi ngôn ngữ</text>
<text x="580.0" y="1437.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#1E1B4B">không làm thay đổi định danh, không ảnh hưởng tới cấu hình DISABLE_TOOLS hay</text>
<text x="580.0" y="1462.0" font-size="22.0" text-anchor="middle" font-weight="400" fill="#1E1B4B">config.json.</text>
