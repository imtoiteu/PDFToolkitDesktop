<text x="810" y="362.3" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">Mỗi bộ nạp giữ một thể</text>
<text x="810" y="385.2" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">hiện singleton</text>
<text x="810" y="408.2" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">và một loadPromise</text>
<text x="810" y="431.1" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">dùng chung để tránh</text>
<text x="810" y="454.1" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">nạp trùng khi nhiều</text>
<text x="810" y="477.0" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">thao tác cùng gọi.</text>
<text x="810" y="499.9" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A"></text>
<text x="810" y="522.9" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">cpdf-helper nạp bằng</text>
<text x="810" y="545.8" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">thẻ &lt;script&gt;;</text>
<text x="810" y="568.8" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">merge.worker.js nạp</text>
<text x="810" y="591.7" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">bằng importScripts().</text>
