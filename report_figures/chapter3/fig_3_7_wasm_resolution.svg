<text x="460" y="332.0" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">Thứ tự ưu tiên khi lấy</text>
<text x="460" y="354.9" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">URL:</text>
<text x="460" y="377.9" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">1. Giá trị người dùng</text>
<text x="460" y="400.8" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">đặt trong localStorage</text>
<text x="460" y="423.8" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">     (khoá</text>
<text x="460" y="446.7" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">bentopdf:wasm-</text>
<text x="460" y="469.6" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">providers)</text>
<text x="460" y="492.6" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">2. Giá trị</text>
<text x="460" y="515.5" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">ENV_DEFAULTS từ biến</text>
<text x="460" y="538.4" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">VITE_*</text>
<text x="460" y="561.4" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">3. CDN_DEFAULTS</text>
<text x="460" y="584.3" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">(jsDelivr) — chỉ bản</text>
<text x="460" y="607.2" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">web</text>
<text x="460" y="630.2" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A"></text>
<text x="460" y="653.1" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">Mọi URL phải thuộc</text>
<text x="460" y="676.1" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">BUILTIN_TRUSTED_HOSTS,</text>
<text x="460" y="699.0" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">nếu không sẽ bị loại</text>
<text x="460" y="721.9" font-size="19.9375" text-anchor="start" font-weight="400" fill="#0F172A">và ghi cảnh báo.</text>
<rect x="800" y="79.75" width="320" height="209.43125" rx="15.95" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.56"/>
