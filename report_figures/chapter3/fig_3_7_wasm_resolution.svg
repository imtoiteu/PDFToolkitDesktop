<text x="580.0" y="806.9" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#713F12">dist/wasm/ được đóng gói vào ứng dụng bởi scripts/copy-wasm-to-dist.mjs</text>
<text x="580.0" y="831.9" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#713F12"></text>
<text x="580.0" y="856.8" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#713F12">pymupdf/ (54 MB — Pyodide, numpy, opencv, pymupdf, pdf2docx, python-docx)   ·</text>
<text x="580.0" y="881.7" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#713F12">ocr/ (47 MB — 8 biến thể tesseract-core, eng.traineddata.gz, NotoSans)   ·   gs/</text>
<text x="580.0" y="906.7" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#713F12">(15 MB)   ·   cpdf/ (6 MB)</text>
<rect x="40" y="1016.8125" width="530" height="263.3125" rx="15.95" fill="#F1F5F9" stroke="#334155" stroke-width="2.56"/>
<text x="305.0" y="1045.7" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">Yêu cầu cách ly nguồn gốc</text>
<text x="305.0" y="1070.7" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A"></text>
<text x="305.0" y="1095.6" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">tauri.conf.json → app.security.headers</text>
<text x="305.0" y="1120.5" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">đặt</text>
<text x="305.0" y="1145.5" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">Cross-Origin-Opener-Policy: same-</text>
<text x="305.0" y="1170.4" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">origin</text>
<text x="305.0" y="1195.3" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">Cross-Origin-Embedder-Policy: require-</text>
<text x="305.0" y="1220.3" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">corp</text>
<text x="305.0" y="1245.2" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">→ SharedArrayBuffer khả dụng cho các</text>
<text x="305.0" y="1270.1" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#0F172A">mô-đun WASM đa luồng</text>
<rect x="600" y="1016.8125" width="520" height="235.2625" rx="15.95" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.56"/>
<text x="860.0" y="1069.1" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#7F1D1D">Cổng kiểm tra trước khi chạy</text>
<text x="860.0" y="1094.0" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#7F1D1D"></text>
<text x="860.0" y="1119.0" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#7F1D1D">requireWasm(pkg) →</text>
<text x="860.0" y="1143.9" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#7F1D1D">WasmProvider.isConfigured(pkg)</text>
<text x="860.0" y="1168.8" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#7F1D1D">Nếu thiếu: showWasmRequiredDialog()</text>
<text x="860.0" y="1193.8" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#7F1D1D">liệt kê các tính năng phụ thuộc và mở</text>
<text x="860.0" y="1218.7" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#7F1D1D">trang wasm-settings.html</text>
<rect x="40" y="1295.9375" width="1080" height="219.3125" rx="15.95" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.56"/>
<text x="580.0" y="1352.7" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#1E1B4B">Kết luận về phụ thuộc mạng của bản desktop</text>
<text x="580.0" y="1377.7" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#1E1B4B"></text>
<text x="580.0" y="1402.6" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#1E1B4B">Không có yêu cầu mạng nào cho các thao tác lõi. Hai tính năng duy nhất chủ động</text>
<text x="580.0" y="1427.5" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#1E1B4B">dùng mạng: (1) đóng dấu thời gian RFC 3161 tới máy chủ TSA do người dùng chọn;</text>
<text x="580.0" y="1452.5" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#1E1B4B">(2) tải phông chữ CJK/Noto theo yêu cầu khi OCR ngôn ngữ tương ứng. Cả hai chỉ</text>
<text x="580.0" y="1477.4" font-size="21.93125" text-anchor="middle" font-weight="400" fill="#1E1B4B">chạy khi người dùng trực tiếp kích hoạt.</text>
