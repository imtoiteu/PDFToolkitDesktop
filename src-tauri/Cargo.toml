[package]
name = "pdf-toolkit"
version = "2.8.5"
description = "Local, offline PDF & image toolkit"
authors = ["Tracy Tran"]
edition = "2021"
rust-version = "1.77.2"

# The library the desktop binary and (potential) mobile targets share.
[lib]
name = "pdf_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
